# version: "3.9"

services:
  # portainer:
  #   image: portainer/portainer-ce:latest
  #   container_name: portainer
  #   volumes:
  #     - /srv/docker/portainer_data:/data
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   ports:
  #     - "9443:9443"

  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    environment:
      - REDIS_ARGS=--requirepass password
    volumes:
      # - redis-data:/data
      - /home/fred/Documents/Docker/Data/redis_stack_data:/data
    ports:
      - "6379:6379"
      - "8001:8001"

  mongo:
    image: mongo:latest
    container_name: mongo
    command: mongod --quiet --logpath /dev/null # get rid of mongo logs
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo-data:/data/db
    networks:
      - commonnet

volumes:
  mongo-data:
    driver: local

networks:
  commonnet:
    name: commonnet
    driver: bridge
